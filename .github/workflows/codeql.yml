# CodeQL static analysis for Go, results published to the Security tab.
#
# The Go extractor does not support build-mode: none, so we use build-mode:
# manual and build every module explicitly. autobuild would build only the root
# module (`go build ./...` stops at nested go.mod boundaries), silently skipping
# the other three - the under-coverage trap from spec edge cases E1/E3. The
# manual build loop below guarantees all four modules enter the CodeQL database.
# CodeQL uploads findings to code scanning; it does not fail the PR (report-only).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build all modules (traced by CodeQL)
        # Build every module so all four enter the CodeQL database. Keep this list
        # in sync with Makefile GO_MODULE_DIRS and the ci.yml matrix.
        run: |
          set -euo pipefail
          for dir in . transport/mcpauth audit/otel dpop/redisreplay; do
            echo "==> go build ($dir)"
            (cd "$dir" && go build ./...)
          done
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:go"
