# gosec SAST, run per module, results published to the Security tab as SARIF.
#
# Policy: REPORT-ONLY for now (-no-fail). gosec also runs as a golangci-lint
# linter for fast local feedback; this standalone job exists so findings land in
# the Security tab with tracking/dismissal and uniform multi-module coverage.
# Promote to blocking (drop -no-fail) once the baseline is reviewed and clean.
name: gosec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: gosec (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: ".", name: "root" }
          - { dir: "transport/mcpauth", name: "transport-mcpauth" }
          - { dir: "audit/otel", name: "audit-otel" }
          - { dir: "dpop/redisreplay", name: "dpop-redisreplay" }
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
      - name: Run gosec (SARIF, report-only)
        working-directory: ${{ matrix.dir }}
        run: |
          gosec -no-fail -exclude-dir=vendor -fmt sarif \
            -out "${{ github.workspace }}/gosec-${{ matrix.name }}.sarif" ./...
      - name: Upload SARIF to code scanning
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: gosec-${{ matrix.name }}.sarif
          category: gosec-${{ matrix.name }}
