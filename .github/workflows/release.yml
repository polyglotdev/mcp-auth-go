# Release integrity: when a v* tag is pushed, re-run the full CI gate as a
# precondition, then generate a dependency SBOM and a signed build-provenance
# attestation and attach them to the GitHub Release. This gives every published
# version a transparent, tamper-evident record of what it contains and how it
# was produced.
#
# Note: mcp-auth-go is a pure library consumed via `go get`; there are no binary
# artifacts to sign. The SBOM (dependency transparency) and provenance are the
# meaningful supply-chain signals here - see spec O2.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # Do not cancel an in-progress release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    uses: ./.github/workflows/ci.yml

  provenance:
    name: SBOM + provenance
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Attach SBOM to the GitHub Release.
      contents: write
      # Mint the OIDC token used to sign the attestation.
      id-token: write
      # Write the build-provenance attestation.
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-release-assets: true
      - name: Attest build provenance for the SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.cdx.json
