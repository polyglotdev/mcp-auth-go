# OpenSSF Scorecard: an automated, public assessment of this project's security
# posture (branch protection, signed releases, pinned dependencies, code review,
# dangerous workflow patterns, and more). publish_results makes the score public
# and enables the README badge - a verifiable trust signal for an auth library.
#
# Runs on push to main and weekly (not on PRs: it needs id-token: write, which
# is unavailable to fork PRs). Some checks (Branch-Protection, Signed-Releases)
# score low until the repo settings in SECURITY.md are configured - expected.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed to upload results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a public OpenSSF Scorecard badge.
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: scorecard
